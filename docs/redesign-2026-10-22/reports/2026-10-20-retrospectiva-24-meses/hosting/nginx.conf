server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /srv/entregas/current;
  index index.html;
  server_tokens off;
  charset utf-8;
  auth_basic "Entregas Catalisa";
  auth_basic_user_file /etc/nginx/entregas.htpasswd;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Cache-Control "private, no-store" always;
  access_log off;
  error_log /dev/stderr warn;

  location = /healthz {
    auth_basic off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    autoindex off;
    try_files $uri $uri/ =404;
  }

  location ~ /\. {
    deny all;
  }
}
