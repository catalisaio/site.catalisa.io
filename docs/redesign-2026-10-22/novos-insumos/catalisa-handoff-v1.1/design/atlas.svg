<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100"><rect width="1400" height="1100" fill="#F6F3EE"/><g font-family="Arial,sans-serif" fill="#35213F"><text x="70" y="70" font-size="17" letter-spacing="3">CATALISA / DIREÇÃO VISUAL / V1.1</text><text x="70" y="160" font-size="66">Uma linguagem.</text><text x="70" y="232" font-size="66" fill="#734B9C">Muitas composições.</text><text x="70" y="286" font-size="22">Geometria com sentido. Espaço para compreender.</text><rect x="70" y="340" width="190" height="105" fill="#56319A" stroke="#CBBED5"/><text x="70" y="475" font-size="18">Assinatura</text><text x="70" y="505" font-size="16">#56319A</text><rect x="280" y="340" width="190" height="105" fill="#734B9C" stroke="#CBBED5"/><text x="280" y="475" font-size="18">Apoio</text><text x="280" y="505" font-size="16">#734B9C</text><rect x="490" y="340" width="190" height="105" fill="#FDC234" stroke="#CBBED5"/><text x="490" y="475" font-size="18">Ponto</text><text x="490" y="505" font-size="16">#FDC234</text><rect x="700" y="340" width="190" height="105" fill="#F18A43" stroke="#CBBED5"/><text x="700" y="475" font-size="18">Expressão</text><text x="700" y="505" font-size="16">#F18A43</text><rect x="910" y="340" width="190" height="105" fill="#F6F3EE" stroke="#CBBED5"/><text x="910" y="475" font-size="18">Papel</text><text x="910" y="505" font-size="16">#F6F3EE</text><rect x="1120" y="340" width="190" height="105" fill="#1A1D23" stroke="#CBBED5"/><text x="1120" y="475" font-size="18">Grafite</text><text x="1120" y="505" font-size="16">#1A1D23</text><path d="M70 550H1330" stroke="#CBBED5"/><text x="70" y="600" font-size="16" letter-spacing="2">FORMAS COM RESPONSABILIDADE</text><rect x="70" y="645" width="150" height="150" fill="#734B9C"/><circle cx="350" cy="720" r="75" fill="#ED9E62"/><circle cx="350" cy="720" r="30" fill="#F6F3EE"/><path d="M500 795L650 645V795Z" fill="#35213F"/><path d="M750 645H900V720A75 75 0 0 1 750 720Z" fill="#B69BCF"/><path d="M965 720H1300" stroke="#B69BCF" stroke-width="2" stroke-dasharray="6 10"/><circle cx="1010" cy="720" r="12" fill="#734B9C"/><circle cx="1170" cy="720" r="12" fill="#ED9E62"/><text x="70" y="835" font-size="18">Capacidade</text><text x="275" y="835" font-size="18">Conexão</text><text x="500" y="835" font-size="18">Direção</text><text x="750" y="835" font-size="18">Continuidade</text><text x="980" y="835" font-size="18">Percurso</text><path d="M70 890H1330" stroke="#CBBED5"/><text x="70" y="945" font-size="32">Uma mensagem dominante por seção.</text><text x="70" y="990" font-size="21">Variar ritmo e metáfora; preservar tipografia, margens e família de cores.</text><text x="70" y="1040" font-size="16">A paleta descreve a implementação. A consolidação de tokens e os ajustes de contraste são propostas de produção.</text></g></svg>
